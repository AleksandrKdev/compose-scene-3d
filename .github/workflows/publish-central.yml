name: Publish Maven Central

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish without the v prefix
        required: true
        default: 0.1.0-alpha03
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  central:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      - name: Set up JDK 22
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '22'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve release version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            release_version="${GITHUB_REF_NAME#v}"
          else
            release_version="${{ inputs.version }}"
          fi
          echo "ORG_GRADLE_PROJECT_libraryVersion=$release_version" >> "$GITHUB_ENV"

      - name: Verify tests and binary API
        run: >-
          ./gradlew
          :scene-core:jvmTest
          :scene-compose:jvmTest
          :renderer-filament:jvmTest
          :renderer-web:wasmJsBrowserTest
          checkKotlinAbi

      - name: Publish and release to Maven Central
        run: ./gradlew publishToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
